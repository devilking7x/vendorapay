# Keeps the Render free-tier service from sleeping (15-min idle spin-down).
# Pings /api/health every 14 minutes so judges never hit a cold start.
name: Keep Render awake

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vendora health
        run: |
          curl --silent --show-error --max-time 40 "https://vendorapay.onrender.com/api/health" || echo "ping failed, ignoring"
